# infrastructure/logging/elasticsearch.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elasticsearch
  namespace: logging
spec:
  dependsOn:
    - name: ingress-nginx
      namespace: flux-system
  interval: 30m
  chart:
    spec:
      chart: elasticsearch
      version: "8.5.1"
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
  
  values:
    replicas: 1
    minimumMasterNodes: 2
    esJavaOpts: "-Xmx1g -Xms1g"
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    persistence:
      enabled: true
    volumeClaimTemplate:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

    # 🟢 EMBEDDED INGRESS ROUTING CONFIGURATION
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      path: /
      hosts:
        - elasticsearch.forbzyltd.com
      tls:
        - secretName: elasticsearch-tls
          hosts:
            - elasticsearch.forbzyltd.com
