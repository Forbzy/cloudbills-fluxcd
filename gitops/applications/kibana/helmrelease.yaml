# infrastructure/logging/kibana.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kibana
  namespace: logging
spec:
  interval: 30m

  chart:
    spec:
      chart: kibana
      version: "8.5.1"
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system

  values:
    elasticsearchHosts: "https://elasticsearch-master.logging.svc:9200"

    extraEnvs:
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"

    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

    ingress:
      enabled: true
      className: nginx

      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"

      hosts:
        - host: kibana.forbzyltd.com
          paths:
            - path: /

      tls:
        - secretName: kibana-tls-certs
          hosts:
            - kibana.forbzyltd.com