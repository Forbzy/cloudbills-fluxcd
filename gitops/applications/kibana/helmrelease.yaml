# infrastructure/logging/kibana.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kibana
  namespace: logging
spec:
  interval: 30m
  chart:
    spec:
      chart: kibana
      version: "8.5.1"
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
  values:
# Inside infrastructure/logging/kibana.yaml
  values:
    elasticsearchHosts: "https://logging.svc"
    extraEnvs:
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
        
    # 🟢 UPDATE THIS TO MATCH YOUR NEW DOMAIN
    ingress:
      enabled: true
      className: nginx
      annotations:
        # Tells cert-manager to automatically fetch a free Let's Encrypt SSL certificate
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: kibana.forbzyltd.com # 🟢 Your real domain name
          paths:
            - path: /
      tls:
        - secretName: kibana-tls-certs
          hosts:
            - kibana.forbzyltd.com
