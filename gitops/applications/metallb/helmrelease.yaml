apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: metallb-system
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    speaker:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    # CRDs will deploy, then this built-in sub-chart creates the resources natively
    ipaddresspools:
      default: # This becomes metadata.name
        spec:
          addresses:
            - 192.168.65.240-192.168.65.250 # Put your IP range here

    l2advertisements:
      default:
        spec:
          ipAddressPools:
            - default
