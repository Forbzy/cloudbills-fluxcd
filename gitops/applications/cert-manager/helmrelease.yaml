apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cert-manager

  # 🟢 FIX 1: Increase the installation window to 15 minutes to survive OKE API throttling
  timeout: 15m0s

  chart:
    spec:
      chart: cert-manager
      version: "v1.18.*"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system

  install:
    createNamespace: true
    crds: CreateReplace
    # 🟢 FIX 2: Stop the controller from waiting on API hooks during the initial push
    disableWait: true

  upgrade:
    crds: CreateReplace
    # 🟢 FIX 3: Maintain identical behavior for automated cluster upgrades
    disableWait: true