# helmrelease-ingress-nginx.yaml - Production NGINX Ingress Controller deployment
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 15m
  releaseName: ingress-nginx
  targetNamespace: ingress-nginx
  
  # 🟢 FIX 1: Move the timeout to the root spec level and increase it to 15 minutes
  timeout: 15m0s

  chart:
    spec:
      chart: ingress-nginx
      version: "4.11.x"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    # 🟢 FIX 2: Stop the controller from hanging on OKE webhook/LB validation loops
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # 🟢 FIX 3: Disable wait for upgrades to match safe behavior profiles
    disableWait: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controller:
      # Run two replicas for high availability
      replicaCount: 1

      # Use the IngressClass resource to register this controller
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
        controllerValue: "k8s.io/ingress-nginx"

      # Resource requests and limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Service configuration for the controller
      service:
        # 🟢 THE FIX: Change from LoadBalancer to NodePort to stop the <pending> loop
        type: NodePort 
        nodePorts:
          # 🟢 Pin the exact HTTP port to match your configuration mapping
          http: 31262 
        enabled: true

      # Enable Prometheus metrics
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespace: ingress-nginx

      # Custom NGINX configuration
      config:
        # Trust X-Forwarded-* headers from an upstream L7 load balancer
        use-forwarded-headers: "true"
        # Enable gzip compression
        use-gzip: "true"
        # Set proxy body size limit
        proxy-body-size: "50m"
        # Connection timeouts
        proxy-connect-timeout: "10"
        proxy-read-timeout: "120"
        proxy-send-timeout: "120"
        # Enable HTTP Strict Transport Security
        hsts: "true"
        hsts-max-age: "31536000"
        hsts-include-subdomains: "true"

      # Pod anti-affinity to spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - ingress-nginx
                topologyKey: kubernetes.io/hostname

      # Pod disruption budget
      minAvailable: 1

      # Autoscaling configuration
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 10
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 80

    # Default backend for unmatched requests
    defaultBackend:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      image:
        # 🟢 SWITCH TO THIS: The modern image that natively supports ARM64 nodes
        repository: registry.k8s.io/defaultbackend-arm64
        tag: "1.5"
        image: "" # Clears any hardcoded suffix hooks